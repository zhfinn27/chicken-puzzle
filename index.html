<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小小土雞研究員</title><style>*{box-sizing:border-box}body{margin:0;background:#f5efdf;color:#263e30;font:18px system-ui}main{max-width:850px;margin:auto;padding:24px}h1{margin:0}button{font:inherit;padding:12px;border:1px solid #b6c4ae;border-radius:12px;background:white;color:inherit;cursor:pointer;margin:4px}button.on{background:#d8e9c9;border:2px solid #397447}section{background:#fffdf5;border-radius:20px;padding:18px;margin:16px 0}.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}svg{width:100%;max-height:300px}button svg{width:55px;height:42px;display:block;margin:auto}.primary{background:#386b46;color:white}small{font-size:13px}@media(max-width:600px){.layout{grid-template-columns:1fr}main{padding:12px}}</style><main><h1>小小土雞研究員</h1><p>認識六種保種雞 · 拼出雞冠、羽色與腳色</p><button id="learn">自由學習</button><button id="quiz">闖關挑戰</button><section><strong id="target"></strong><p id="score"></p><div class="layout"><div id="bird"></div><div id="choices"></div></div><button id="hint">提示</button><button class="primary" id="check">確認答案</button><button id="next">下一題</button><p id="feedback" aria-live="polite"></p></section><small>本遊戲依指定簡化表型設計，非正式品種鑑定工具。不蒐集個人資料。</small></main><script>
const B=[['金門土雞',0,0,0],['竹崎土雞',0,2,1],['石岐雞',0,1,2],['花東土雞',1,2,1],['信義土雞',0,3,2],['名古屋雞',0,1,0]],N=[['單冠','豆冠'],['黃羽帶金黃','素黃色','黑色','紅色'],['灰色','黑色','黃色']],C=['#edc13c','#edc13c','#292b2d','#b94329'],L=['#909398','#282a2d','#e6b62e'],P=['M28 29 L25 19 L34 22 L35 9 L44 19 L49 6 L55 22 L62 15 L60 31 Q45 25 28 29Z','M28 28 Q24 20 33 20 Q36 11 43 19 Q51 12 54 21 Q64 19 60 29Z'];const $=x=>document.getElementById(x);let mode,order,i,s,score,miss,done;function bird(){let [c,b,l]=s,a=b===0?'#d99519':C[b];return `<svg viewBox="0 0 150 170"><g stroke="${L[l]}" stroke-width="7" stroke-linecap="round" fill="none"><path d="M60 115 L58 145 L42 153 M58 145 L58 157 M58 145 L73 153 M91 115 L93 145 L78 153 M93 145 L94 157 M93 145 L109 153"/></g><g fill="${C[b]}" stroke="#504438" stroke-width="1.4"><path d="M96 103 Q139 93 132 38 Q117 39 105 66 Q113 36 100 31 Q89 47 85 79Z"/><ellipse cx="76" cy="93" rx="39" ry="30"/><path d="M38 92 Q25 65 34 44 L60 40 Q62 60 74 81 Q52 103 38 92Z" fill="${a}"/><circle cx="43" cy="40" r="17"/><path d="M53 84 Q81 71 109 86 Q92 111 64 108 Q51 103 53 84Z"/></g><path d="${P[c]}" fill="#c74740" stroke="#932c2b"/><path d="M30 40 L12 46 L29 51Z" fill="#ddb33d"/><ellipse cx="34" cy="56" rx="5" ry="10" fill="#c74740"/><circle cx="37" cy="37" r="3" fill="#171717"/></svg>`}function piece(g,j){return g===0?`<svg viewBox="20 0 48 35"><path d="${P[j]}" fill="#c74740"/></svg>`:g===1?`<svg viewBox="0 0 90 65"><path d="M57 45 Q88 30 80 5 Q65 10 60 25Z" fill="${C[j]}"/><ellipse cx="40" cy="42" rx="33" ry="21" fill="${C[j]}"/><path d="M12 40 L8 5 L28 5 L43 38 Q25 53 12 40Z" fill="${j===0?'#d99519':C[j]}"/></svg>`:`<svg viewBox="0 0 90 65"><g stroke="${L[j]}" stroke-width="7" stroke-linecap="round" fill="none"><path d="M25 5 L27 45 L12 57 M27 45 L28 60 M27 45 L40 56 M62 5 L60 45 L47 57 M60 45 L61 60 M60 45 L76 56"/></g></svg>`}function render(){let t=B[order[i]],match=B.find(x=>x.slice(1).every((v,k)=>v===s[k]));$('target').textContent=mode==='quiz'?i===6?'挑戰完成！':`第 ${i+1} 題：拼出${t[0]}`:match?match[0]:'自由組合';$('score').textContent=mode==='quiz'?`首次答對且未用提示：${score}/6`:'';$('bird').innerHTML=bird();$('choices').innerHTML=N.map((a,g)=>`<div><b>${['雞冠','羽色','腳色'][g]}</b><br>${a.map((n,j)=>`<button ${done?'disabled':''} class="${s[g]===j?'on':''}" onclick="pick(${g},${j})">${piece(g,j)}${n}</button>`).join('')}</div>`).join('');$('check').hidden=$('hint').hidden=mode!=='quiz'||done;$('next').hidden=mode!=='quiz'||!done;$('next').textContent=i===6?'重新挑戰':'下一題'}function pick(g,j){s[g]=j;$('feedback').textContent='';render()}function start(m){mode=m;order=[0,1,2,3,4,5];if(m==='quiz')for(let k=5;k>0;k--){let j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]]}i=score=0;s=[0,1,0];miss=done=false;$('feedback').textContent='';render()}$('learn').onclick=()=>start('learn');$('quiz').onclick=()=>start('quiz');$('hint').onclick=()=>{miss=true;$('feedback').textContent=B[order[i]].slice(1).map((v,k)=>N[k][v]).join('、')};$('check').onclick=()=>{let w=B[order[i]].slice(1).map((v,k)=>v===s[k]?'':['雞冠','羽色','腳色'][k]).filter(Boolean);if(w.length){miss=true;$('feedback').textContent='再觀察：'+w.join('、')}else{done=true;if(!miss)score++;$('feedback').textContent='答對了！';render()}};$('next').onclick=()=>{if(i===6)return start('quiz');i++;done=i===6;miss=false;s=[0,1,0];$('feedback').textContent=done?'六題完成！':'';render()};start('quiz');</script></html>
